[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thaghr"
version = "0.1.0"
description = "Chaos engineering and reliability measurement for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Taoheed A. Abdulraheem"}]
keywords = ["ai", "agents", "chaos-engineering", "reliability", "testing", "llm", "sre"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Distributed Computing",
]
dependencies = ["httpx>=0.27", "prometheus-client>=0.20", "openai>=1.40,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
pretty = ["rich>=13"]

[project.scripts]
thaghr = "thaghr.cli:main"

[project.urls]
Homepage = "https://thaghr.dev"
Repository = "https://github.com/thaghr/thaghr"
Issues = "https://github.com/thaghr/thaghr/issues"

[tool.setuptools.packages.find]
where = ["src"]